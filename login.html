<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — Police Fédérale Liège</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<div id="loadingOverlay" class="loading-overlay"><div class="loading-inner"><img src="https://i.imgur.com/Pe4YRPe.png" class="loading-shield" alt="Police Fédérale Liège"><div class="loading-text">Chargement...</div></div></div>
<div id="toastContainer" class="toast-container"></div>

<header class="main-header">
    <div class="header-inner">
        <a href="index.html" class="header-logo">
            <img src="https://i.imgur.com/Pe4YRPe.png" class="logo-shield" alt="Police Fédérale Liège">
            <div class="logo-text"><span class="logo-title">Police Fédérale</span><span class="logo-sub">Liège City RP</span></div>
        </a>
        <nav class="main-nav" id="mainNav">
            <a href="index.html">Accueil</a>
            <a href="about.html">À Propos</a>
            <a href="recruitment.html">Recrutement</a>
            <a href="gallery.html">Galerie</a>
            <a href="complaint-deposit.html">Dépôt de Plainte</a>
        </nav>
        <div class="header-actions">
            <a href="login.html" class="btn-connexion">Connexion</a>
            <button class="hamburger" onclick="document.getElementById('mainNav').classList.toggle('open')"><span></span><span></span><span></span></button>
        </div>
    </div>
</header>

<div class="auth-page">
    <div style="width:100%;max-width:440px">
        <div class="form-card">
            <div class="form-card-header">
                <img src="https://i.imgur.com/pszLvSs.png" style="width:70px;height:70px;object-fit:contain;margin-bottom:10px;filter:drop-shadow(0 2px 8px rgba(0,26,77,0.2))" alt="Police Fédérale Liège">
                <h2>Connexion</h2>
                <p>Accédez à votre espace personnel</p>
            </div>

            <div id="loginAlert" style="display:none" class="alert alert-danger"></div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label class="form-label">Nom d'utilisateur <span class="required">*</span></label>
                    <input type="text" id="loginUsername" class="form-control" placeholder="Votre nom d'utilisateur" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label class="form-label">Mot de passe <span class="required">*</span></label>
                    <input type="password" id="loginPassword" class="form-control" placeholder="Votre mot de passe" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;border-radius:var(--radius)">
                    🔐 Se Connecter
                </button>
            </form>

            <div style="text-align:center;margin-top:20px;font-size:0.88rem;color:var(--text-muted)">
                Pas encore de compte ?
                <a href="register.html" style="color:var(--primary-light);font-weight:600"> Créer un compte civil</a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="js/main.js"></script>
<script>
    // Redirect if already logged in
    if (getCurrentUser()) {
        const u = getCurrentUser();
        window.location.href = u.role === 'civil' ? 'civil-complaints.html' : 'police-complaints.html';
    }
    hideLoading();

    async function handleLogin(e) {
        e.preventDefault();
        const username = document.getElementById('loginUsername').value.trim();
        const password = document.getElementById('loginPassword').value;
        const alert = document.getElementById('loginAlert');
        alert.style.display = 'none';

        const btn = e.target.querySelector('button[type=submit]');
        btn.disabled = true;
        btn.textContent = 'Connexion en cours...';

        const { user, error } = await login(username, password);
        if (error) {
            alert.style.display = 'flex';
            alert.innerHTML = `⚠️ ${error}`;
            btn.disabled = false;
            btn.innerHTML = '🔐 Se Connecter';
        } else {
            showToast('✅ Connexion réussie', `Bienvenue ${user.prenom} !`, 'success');
            setTimeout(() => {
                window.location.href = user.role === 'civil' ? 'index.html' : 'police-complaints.html';
            }, 800);
        }
    }
</script>
</body>
</html>
