<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formations — Police Fédérale Liège</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Exo+2:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        :root{--bg:#030a14;--panel:rgba(4,12,26,0.97);--blue:#1a56db;--blue-light:#3b82f6;--blue-dim:rgba(26,86,219,0.15);--blue-border:rgba(26,86,219,0.22);--gold:#c9a227;--gold-light:#e4b93a;--gold-dim:rgba(201,162,39,0.15);--gold-border:rgba(201,162,39,0.25);--text:#c5d8f0;--text-bright:#e8f4ff;--muted:#4a7a9b;--green:#22c55e;--green-dim:rgba(34,197,94,0.15);--green-border:rgba(34,197,94,0.25);--red:#ef4444;--red-dim:rgba(239,68,68,0.15)}
        html,body{height:100%;background:var(--bg);font-family:'Exo 2',sans-serif;color:var(--text);overflow:hidden}
        body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(26,86,219,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(26,86,219,0.03) 1px,transparent 1px);background-size:40px 40px;animation:gridDrift 50s linear infinite}
        @keyframes gridDrift{0%{background-position:0 0}100%{background-position:40px 40px}}
        .t-header{height:56px;background:rgba(3,10,20,.99);border-bottom:1px solid var(--blue-border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:relative;z-index:100;flex-shrink:0}
        .t-header::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold),var(--blue),transparent);opacity:.4}
        .hdr-left{display:flex;align-items:center;gap:14px}
        .logo-link{display:flex;align-items:center;gap:9px;text-decoration:none}
        .logo-link img{width:28px;height:33px;filter:drop-shadow(0 0 6px rgba(201,162,39,0.4))}
        .logo-txt .m{font-family:'Rajdhani',sans-serif;font-size:15px;font-weight:700;letter-spacing:3px;color:#fff;display:block;line-height:1}
        .logo-txt .s{font-size:9px;letter-spacing:2px;color:var(--gold);text-transform:uppercase;display:block}
        .divider{width:1px;height:28px;background:var(--blue-border)}
        .sec-badge{font-family:'Rajdhani',sans-serif;font-size:11px;font-weight:700;letter-spacing:2px;color:var(--gold);background:var(--gold-dim);border:1px solid var(--gold-border);padding:3px 10px;border-radius:2px}
        .hdr-nav{display:flex;align-items:center;gap:2px}
        .hdr-nav a{font-family:'Rajdhani',sans-serif;font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);text-decoration:none;padding:5px 9px;border-radius:2px;transition:all .15s}
        .hdr-nav a:hover,.hdr-nav a.active{color:var(--text-bright);background:var(--blue-dim)}
        .btn{font-family:'Rajdhani',sans-serif;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:6px 12px;border:none;border-radius:2px;cursor:pointer;transition:all .2s;text-decoration:none;display:inline-flex;align-items:center;gap:5px}
        .btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--blue-border)}.btn-ghost:hover{color:var(--text);border-color:var(--blue-light)}
        .btn-gold{background:var(--gold);color:#000;font-weight:700}.btn-gold:hover{background:var(--gold-light)}
        .btn-success{background:var(--green-dim);color:#86efac;border:1px solid var(--green-border)}.btn-success:hover{background:rgba(34,197,94,.25)}
        .app-body{display:flex;height:calc(100vh - 56px);position:relative;z-index:1}
        .course-list{width:285px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--blue-border);display:flex;flex-direction:column;overflow:hidden}
        .cl-header{padding:14px;border-bottom:1px solid var(--blue-border)}
        .cl-title{font-family:'Rajdhani',sans-serif;font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--blue-light);margin-bottom:10px}
        .progress-bar-wrap{background:rgba(26,86,219,.1);border-radius:10px;height:6px;overflow:hidden}
        .progress-bar{height:100%;background:linear-gradient(90deg,var(--blue),var(--gold));border-radius:10px;transition:width .5s}
        .progress-text{font-size:10px;color:var(--muted);margin-top:5px;letter-spacing:1px}
        .cl-scroll{flex:1;overflow-y:auto;padding:8px}
        .course-item{padding:10px 12px;margin-bottom:5px;background:rgba(26,86,219,.05);border:1px solid var(--blue-border);border-radius:4px;cursor:pointer;transition:all .15s}
        .course-item:hover{background:var(--blue-dim);border-color:var(--blue-light)}
        .course-item.active{background:var(--blue-dim);border-color:var(--blue-light);border-left:3px solid var(--blue-light)}
        .course-item.completed{border-color:var(--green-border)}.course-item.completed.active{border-left-color:var(--green)}
        .ci-top{display:flex;align-items:center;gap:8px;margin-bottom:4px}
        .ci-icon{font-size:16px}.ci-name{font-family:'Rajdhani',sans-serif;font-size:13px;font-weight:700;letter-spacing:1px;color:var(--text-bright);flex:1}
        .ci-check{color:var(--green);font-size:13px}
        .ci-desc{font-size:10px;color:var(--muted);line-height:1.5}
        .ci-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
        .ci-tag{font-size:8px;letter-spacing:1px;padding:1px 5px;border-radius:2px;background:var(--blue-dim);border:1px solid var(--blue-border);color:var(--muted);text-transform:uppercase}
        .course-content{flex:1;display:flex;flex-direction:column;overflow:hidden}
        .cc-header{padding:14px 20px;border-bottom:1px solid var(--blue-border);display:flex;align-items:center;justify-content:space-between;background:rgba(4,12,26,.5);flex-shrink:0}
        .cc-title{font-family:'Rajdhani',sans-serif;font-size:18px;font-weight:700;letter-spacing:2px;color:var(--text-bright)}
        .cc-meta{font-size:10px;color:var(--muted);letter-spacing:1px;margin-top:2px}
        .cc-scroll{flex:1;overflow-y:auto;padding:28px 32px}
        .cc-footer{padding:13px 20px;border-top:1px solid var(--blue-border);display:flex;align-items:center;justify-content:space-between;background:rgba(4,12,26,.5);flex-shrink:0}
        .chc{line-height:1.85;font-size:13px;color:var(--text);max-width:820px}
        .chc h1{font-family:'Rajdhani',sans-serif;font-size:26px;font-weight:700;letter-spacing:2px;color:var(--gold-light);margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid var(--gold-border)}
        .chc h2{font-family:'Rajdhani',sans-serif;font-size:19px;font-weight:700;letter-spacing:1.5px;color:var(--blue-light);margin:28px 0 12px}
        .chc h3{font-family:'Rajdhani',sans-serif;font-size:15px;font-weight:700;letter-spacing:1px;color:var(--text-bright);margin:18px 0 8px;padding:6px 10px;background:rgba(26,86,219,.06);border-left:3px solid var(--blue);border-radius:0 3px 3px 0}
        .chc p{margin-bottom:12px}
        .chc ul,.chc ol{margin:8px 0 12px 20px}
        .chc li{margin-bottom:6px}
        .chc strong{color:var(--text-bright)}
        .chc em{color:var(--gold-light);font-style:normal;font-weight:600}
        .chc .sanction{background:rgba(239,68,68,.07);border:1px solid rgba(239,68,68,.2);border-left:3px solid var(--red);border-radius:0 4px 4px 0;padding:8px 12px;margin:8px 0 14px;font-size:12px;color:#fca5a5}
        .chc .sanction::before{content:'⚖ Sanction : ';font-weight:700;font-family:'Rajdhani',sans-serif;letter-spacing:1px}
        .chc .info-box{background:var(--blue-dim);border:1px solid var(--blue-border);border-radius:4px;padding:12px 14px;margin:12px 0;font-size:12px}
        .chc .warning-box{background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.25);border-radius:4px;padding:12px 14px;margin:12px 0;color:#fcd34d;font-size:12px}
        .chc table{width:100%;border-collapse:collapse;margin:14px 0;font-size:11px}
        .chc th{padding:8px 10px;background:rgba(26,86,219,.12);border:1px solid var(--blue-border);font-family:'Rajdhani',sans-serif;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--blue-light);text-align:left}
        .chc td{padding:7px 10px;border:1px solid rgba(26,86,219,.15);vertical-align:top}
        .chc tr:hover td{background:rgba(26,86,219,.04)}
        .chc .crime{color:#fca5a5;font-weight:700}
        .chc .delit{color:#fcd34d;font-weight:700}
        .chc .contrav{color:#86efac;font-weight:700}
        .welcome-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;gap:16px;opacity:.5}
        .completed-banner{background:var(--green-dim);border:1px solid var(--green-border);border-radius:4px;padding:9px 13px;margin-bottom:16px;display:flex;align-items:center;gap:8px;font-size:11px;color:#86efac;font-family:'Rajdhani',sans-serif;letter-spacing:1px}
        ::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:var(--blue-border);border-radius:2px}
    </style>
</head>
<body>
<header class="t-header">
    <div class="hdr-left">
        <a href="index.html" class="logo-link"><img src="https://i.imgur.com/Pe4YRPe.png" alt="PFL"><div class="logo-txt"><span class="m">Police Fédérale</span><span class="s">Liège City RP</span></div></a>
        <div class="divider"></div>
        <div class="sec-badge">📚 Formations</div>
        <nav class="hdr-nav" id="mainNav"></nav>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
        <a href="police-rdv.html" class="btn btn-gold">📅 Prendre RDV</a>
        <a href="police-portal.html" class="btn btn-ghost">← Portail</a>
    </div>
</header>
<div class="app-body">
    <div class="course-list">
        <div class="cl-header">
            <div class="cl-title">📋 Cours Disponibles</div>
            <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
            <div class="progress-text" id="progressText">Chargement...</div>
        </div>
        <div class="cl-scroll" id="courseListEl"></div>
    </div>
    <div class="course-content">
        <div id="courseHeader" class="cc-header" style="display:none">
            <div><div class="cc-title" id="courseTitleEl">—</div><div class="cc-meta" id="courseMetaEl">—</div></div>
        </div>
        <div class="cc-scroll" id="courseScroll">
            <div class="welcome-screen" id="welcomeScreen">
                <div style="font-size:5rem">📚</div>
                <div style="font-family:'Rajdhani',sans-serif;font-size:20px;font-weight:700;letter-spacing:3px;color:var(--muted)">Sélectionnez un cours</div>
                <div style="font-size:12px;color:var(--muted)">Choisissez un module dans la liste à gauche</div>
            </div>
            <div id="courseBody" style="display:none">
                <div id="completedBannerEl" style="display:none" class="completed-banner">✓ Vous avez déjà complété ce cours</div>
                <div class="chc" id="courseContentHtml"></div>
            </div>
        </div>
        <div id="courseFooter" class="cc-footer" style="display:none">
            <div style="font-size:11px;color:var(--muted)" id="footerInfo">—</div>
            <button class="btn btn-success" id="markReadBtn" onclick="markCompleted()">✓ Marquer comme lu</button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="js/main.js"></script>
<script>
// ════════════════════════════════════════════════════
// CONTENU DES COURS — INTÉGRÉ DIRECTEMENT DANS LE HTML
// ════════════════════════════════════════════════════
const DEFAULT_COURSES = [
  {
    ordre: 1, icon: '🚦', badge_icon: '🚦', badge_titre: 'Code de la Route — Certifié',
    titre: 'Code de la Route',
    description: 'Règles de circulation routière, aérienne et maritime de Liège City',
    tags: ['Routier', 'Aérien', 'Maritime'],
    content: `
      <h1>🚦 Code de la Route — Liège City</h1>
      <div class="info-box">ℹ️ Ce cours couvre les 3 titres du Code de la Route applicables sur le territoire de Liège City. Toute méconnaissance de ces règles engage votre responsabilité.</div>

      <h2>Titre 1 — Circulation Routière</h2>

      <h3>Art. 1.1 — Stationnement gênant</h3>
      <p>Interdit de stationner si le véhicule empêche l'accès à une propriété, bloque un autre véhicule, obstrue la circulation des piétons, ou se trouve à moins de <strong>15 mètres</strong> d'un arrêt de bus.</p>
      <div class="sanction">100€ à 200€</div>

      <h3>Art. 1.2 — Stationnement PMR / très gênant</h3>
      <p>Interdit sur tout emplacement réservé aux personnes à mobilité réduite, sur les trottoirs, pistes cyclables ou devant les bouches d'incendie.</p>
      <div class="sanction">250€ à 450€ + Dépannage du véhicule</div>

      <h3>Art. 1.3 — Non-port du casque (deux-roues)</h3>
      <p>Le conducteur et le passager de tout deux-roues motorisé doivent porter un casque homologué.</p>
      <div class="sanction">100€ à 200€</div>

      <h3>Art. 1.4 — Phares non fonctionnels</h3>
      <p>Les feux de croisement sont obligatoires de nuit et en visibilité réduite. Conduire avec des phares défectueux est interdit.</p>
      <div class="sanction">100€ à 200€</div>

      <h3>Art. 1.6 — Excès de vitesse (faible, &lt; 30 km/h)</h3>
      <p>Limitations sans signalisation : <em>70 km/h</em> en agglomération, <em>100 km/h</em> hors agglomération, <em>140 km/h</em> sur autoroute.</p>
      <div class="sanction">150€ à 300€ — Retrait permis possible</div>

      <h3>Art. 1.7 — Non-respect du STOP / feu rouge</h3>
      <p>Arrêt complet obligatoire à la ligne d'arrêt, priorité accordée. Franchissement d'un feu rouge : infraction grave.</p>
      <div class="sanction">200€ à 400€ — Retrait permis possible</div>

      <h3>Art. 1.8 — Usage du téléphone au volant</h3>
      <p>Interdit de tenir en main tout appareil électronique lorsque le véhicule est en mouvement.</p>
      <div class="sanction">200€ à 400€ — Retrait permis possible</div>

      <h3>Art. 1.9 — Franchissement ligne continue</h3>
      <div class="sanction">200€ à 350€ — Retrait permis possible</div>

      <h3>Art. 1.10 — Circulation en contre-sens</h3>
      <div class="sanction">250€ à 450€ — Retrait permis possible</div>

      <h3>Art. 1.11 — Dépassement dangereux</h3>
      <p>Est dangereux tout dépassement sans visibilité suffisante (virage, sommet de côte) ou obligeant les autres à modifier brusquement leur allure.</p>
      <div class="sanction">150€ à 300€ — Retrait permis possible</div>

      <h3>Art. 1.12 — Circulation sur bande d'arrêt d'urgence</h3>
      <p>Réservée exclusivement aux véhicules en panne ou aux services d'urgence (Police, EMS).</p>
      <div class="sanction">200€ à 350€ — Retrait permis possible</div>

      <h3>Art. 1.13 — Nuisance sonore</h3>
      <p>Klaxon interdit sauf danger immédiat. Bruits excessifs du moteur (échappements modifiés) interdits.</p>
      <div class="sanction">100€ à 250€</div>

      <h3>Art. 1.14 — Drift / Conduite en roue arrière</h3>
      <p>Perte de contrôle volontaire (drift, burnout) ou conduite acrobatique mettant en danger autrui : interdit.</p>
      <div class="sanction">300€ à 500€ — Retrait permis possible</div>

      <h3>Art. 1.15 — Documents expirés</h3>
      <div class="sanction">150€ à 300€</div>

      <h3>Art. 1.16 — Défaut de plaque d'immatriculation</h3>
      <div class="sanction">350€ à 650€ + Dépannage</div>

      <h3>Art. 1.17 — Défaut licence taxi</h3>
      <p>Nul ne peut exercer comme chauffeur de taxi sans licence valide et taximètre homologué.</p>
      <div class="sanction">750€ à 1 500€ + 5 à 15 min PL + Saisie possible</div>

      <h3>Art. 1.19 — Défaut de permis de conduire</h3>
      <div class="sanction">1 000€ à 2 000€ + 10 à 20 min PL + Dépannage</div>

      <h3>Art. 1.20 — Défaut d'assurance</h3>
      <div class="sanction">1 500€ à 2 500€ + 5 à 15 min PL + Dépannage</div>

      <h3>Art. 1.21 — Excès de vitesse grave (+31 km/h)</h3>
      <div class="sanction">750€ à 1 500€ + 5 à 15 min PL + Saisie + Retrait permis</div>

      <h3>Art. 1.22 — Conduite sous stupéfiants</h3>
      <div class="sanction">3 500€ à 5 500€ + 20 à 30 min PL + Saisie + Retrait permis + Saisie stupéfiants</div>

      <h3>Art. 1.23 — Conduite en état d'ivresse</h3>
      <div class="sanction">3 000€ à 5 000€ + 20 à 30 min PL + Saisie + Retrait permis</div>

      <h3>Art. 1.24 — Délit de fuite</h3>
      <p>Obligation de s'arrêter et de communiquer son identité après tout accident. Fuir constitue un délit.</p>
      <div class="sanction">4 000€ à 6 000€ + 20 à 30 min PL + Saisie + Retrait permis</div>

      <h3>Art. 1.25 — Refus d'obtempérer (simple)</h3>
      <p>Ne pas s'arrêter à un contrôle ou refuser d'obéir à un ordre verbal des FDO.</p>
      <div class="sanction">2 500€ à 4 500€ + 15 à 25 min PL + Retrait permis</div>

      <h3>Art. 1.26 — Refus d'obtempérer aggravé (mise en danger)</h3>
      <p>Refus d'obtempérer mettant en danger la vie des agents ou d'autrui.</p>
      <div class="sanction">6 000€ à 9 000€ + 25 à 30 min PL + Saisie + Retrait permis</div>

      <h3>Art. 1.27 — Entrave méchante / Conduite dangereuse</h3>
      <div class="sanction">2 000€ à 3 500€ + 15 à 25 min PL + Saisie + Retrait permis</div>

      <h3>Art. 1.28 — Course urbaine illégale (Rodéo)</h3>
      <div class="sanction">1 500€ à 3 000€ + 10 à 20 min PL + Saisie + Retrait permis</div>

      <h3>Art. 1.30 — Usage abusif des avertisseurs spéciaux</h3>
      <p>Sirènes et gyrophares réservés aux FDO et services d'urgence en mission. Interdit sur tout véhicule civil.</p>
      <div class="sanction">1 000€ à 2 000€ + Saisie des dispositifs + Dépannage si non-conforme</div>

      <h3>Art. 1.32 — Vitres teintées (opacité totale)</h3>
      <p>Le pare-brise et les vitres avant doivent permettre l'identification du conducteur.</p>
      <div class="sanction">1re fois : 500€ à 750€. Récidive après 7 jours : Fourrière administrative</div>

      <h3>Art. 1.34 — Néons non conformes</h3>
      <p>Éclairage décoratif au sol autorisé uniquement à l'arrêt. En circulation : lumière fixe uniquement. Clignotants/stroboscopiques : interdits.</p>
      <div class="sanction">1re fois : 500€ à 750€. Récidive après 7 jours : Fourrière administrative</div>

      <h2>Titre 2 — Code Aérien</h2>

      <table>
        <tr><th>Article</th><th>Infraction</th><th>Sanction</th></tr>
        <tr><td>Art. 2.1</td><td>Atterrissage zone non homologuée</td><td>7 500€ à 15 000€ + Saisie</td></tr>
        <tr><td>Art. 2.4</td><td>Vol trop bas sur zones urbaines (&lt;200m)</td><td>900€ à 1 500€ + Saisie</td></tr>
        <tr><td>Art. 2.7</td><td>Survol en aéronef armé (hors autorisation)</td><td>4 000€ à 6 000€ + 15-25 min PL + Saisie</td></tr>
        <tr><td>Art. 2.10</td><td>Défaut de licence de pilote</td><td>5 000€ à 10 000€ + 20-30 min PL + Saisie</td></tr>
        <tr><td>Art. 2.11</td><td>Absence veille radio (fréquence 600) ou plan de vol</td><td>3 000€ à 5 000€ + tir de neutralisation autorisé</td></tr>
      </table>

      <div class="warning-box">⚠️ Art. 2.11 : L'absence de plan de vol ou le silence radio autorise les FDO à abattre l'appareil.</div>

      <h2>Titre 3 — Code Maritime et Fluvial</h2>

      <table>
        <tr><th>Article</th><th>Infraction</th><th>Sanction</th></tr>
        <tr><td>Art. 3.1</td><td>Excès de vitesse en zone portuaire</td><td>200€ à 400€</td></tr>
        <tr><td>Art. 3.4</td><td>Navigation dans zone baignade (50m)</td><td>200€ à 350€</td></tr>
        <tr><td>Art. 3.7</td><td>Défaut de permis de navigation</td><td>1 000€ à 2 000€ + 10-20 min PL + Saisie</td></tr>
        <tr><td>Art. 3.8</td><td>Mise en danger délibérée (navigation)</td><td>3 000€ à 5 000€ + 20-30 min PL + Saisie</td></tr>
        <tr><td>Art. 3.9</td><td>Conduite sous influence (bateau)</td><td>3 500€ à 5 500€ + 20-30 min PL + Saisie + Retrait permis</td></tr>
      </table>
    `
  },
  {
    ordre: 2, icon: '⚖️', badge_icon: '⚖️', badge_titre: 'Code Judiciaire — Certifié',
    titre: 'Code Judiciaire',
    description: 'Procédure d\'enquête, d\'instruction et de jugement des infractions',
    tags: ['Procédure', 'Instruction', 'Tribunal'],
    content: `
      <h1>⚖️ Code Judiciaire — Liège City</h1>
      <div class="info-box">ℹ️ Ce cours couvre la procédure pénale complète : de l'action judiciaire au jugement, en passant par les droits de la défense et la réhabilitation.</div>

      <h2>Titre 1 — L'Action Judiciaire</h2>

      <h3>Art. 1.1 — Le Parquet</h3>
      <p>Le <strong>Procureur du Roi</strong> reçoit les procès-verbaux des services de police, dirige les enquêtes judiciaires et exerce l'action publique au nom de la société.</p>

      <h3>Art. 1.2 — Opportunité des poursuites</h3>

      <h3>Art. 1.4 — Arrestation Citoyenne</h3>

      § 3 — Force <strong>strictement proportionnée</strong>. Interdit : violences gratuites ou déplacement en lieu privé (séquestration).<br>

      <h3>Art. 2.4 — Écoutes téléphoniques</h3>
      <p>Autorisées uniquement sur autorisation écrite d'un Juge d'Instruction, pour enquêtes de crimes/délits graves, durée limitée.</p>

      <h3>Art. 3.9 — Principe du Contradictoire</h3>

      <h3>Art. 3.10 — Majoration des peines</h3>

      <h2>Titre 4 — Droits des Parties</h2>

let courses = [], progressMap = {}, currentCourseId = null;

async function initCourses() {
  // Charger les formations depuis la DB
  let { data: db } = await supabase.from('table_policefed_formations').select('*').order('ordre');

  if (!db || db.length === 0) {
    // Insérer les 4 cours par défaut si la table est vide
    const inserts = DEFAULT_COURSES.map(c => ({
      titre: c.titre, description: c.description, content: c.content,
      ordre: c.ordre, icon: c.icon, badge_icon: c.badge_icon, badge_titre: c.badge_titre
    }));
    const { data: ins } = await supabase.from('table_policefed_formations').insert(inserts).select();
    db = ins || [];
  } else {
    // Si le contenu est vide/manquant, le patcher depuis les cours locaux
    for (const dc of DEFAULT_COURSES) {
      const ex = db.find(c => c.ordre === dc.ordre);
      if (ex && (!ex.content || ex.content.length < 100)) {
        await supabase.from('table_policefed_formations')
          .update({ content: dc.content, description: dc.description })
          .eq('id', ex.id);
        ex.content = dc.content;
      }
    }
  }

  courses = db;

  // Charger la progression
  const { data: prog } = await supabase.from('table_policefed_progress')
    .select('*').eq('user_id', currentUser.id);
  progressMap = {};
  (prog || []).forEach(p => progressMap[p.formation_id] = p);

  renderCourseList();
}

function getCourseLocal(c) {
  return DEFAULT_COURSES.find(x => x.ordre === c.ordre);
}

function renderCourseList() {
  const done = courses.filter(c => progressMap[c.id]?.completed).length;
  const pct = courses.length > 0 ? Math.round(done / courses.length * 100) : 0;
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('progressText').textContent = `${done} / ${courses.length} cours complétés`;
  document.getElementById('courseListEl').innerHTML = courses.map(c => {
    const d = progressMap[c.id]?.completed;
    const dc = getCourseLocal(c);
    return `<div class="course-item ${d?'completed':''} ${currentCourseId===c.id?'active':''}" onclick="openCourse('${c.id}')">
      <div class="ci-top">
        <div class="ci-icon">${c.icon||'📚'}</div>
        <div class="ci-name">${escapeHtml(c.titre)}</div>
        ${d ? '<div class="ci-check">✓</div>' : ''}
      </div>
      <div class="ci-desc">${escapeHtml(c.description||'')}</div>
      <div class="ci-tags">${(dc?.tags||[]).map(t=>`<span class="ci-tag">${t}</span>`).join('')}</div>
    </div>`;
  }).join('');
}

function openCourse(id) {
  const c = courses.find(x => x.id === id);
  if (!c) return;
  currentCourseId = id;
  const done = progressMap[id]?.completed;
  const dc = getCourseLocal(c);
  const content = (c.content && c.content.length > 100) ? c.content : (dc?.content || '<p>Contenu non disponible.</p>');

  document.getElementById('welcomeScreen').style.display = 'none';
  document.getElementById('courseBody').style.display = 'block';
  document.getElementById('courseHeader').style.display = 'flex';
  document.getElementById('courseFooter').style.display = 'flex';
  document.getElementById('courseTitleEl').textContent = c.titre;
  document.getElementById('courseMetaEl').textContent = `${c.icon||'📚'} Module de Formation — Police Fédérale Liège`;
  document.getElementById('courseContentHtml').innerHTML = content;
  document.getElementById('completedBannerEl').style.display = done ? 'flex' : 'none';
  document.getElementById('footerInfo').textContent = done
    ? `✓ Complété le ${formatDateFull ? formatDateFull(progressMap[id]?.completed_at) : progressMap[id]?.completed_at?.slice(0,10)}`
    : 'Lisez le cours entièrement avant de le marquer.';

  const btn = document.getElementById('markReadBtn');
  btn.innerHTML = done ? '✓ Cours complété' : '✓ Marquer comme lu';
  btn.disabled = done;
  btn.style.opacity = done ? '.5' : '1';
  document.getElementById('courseScroll').scrollTop = 0;
  renderCourseList();
}

async function markCompleted() {
  if (!currentCourseId) return;
  const btn = document.getElementById('markReadBtn');
  btn.disabled = true; btn.textContent = 'Enregistrement...';
  const { error } = await supabase.from('table_policefed_progress').upsert(
    { user_id: currentUser.id, formation_id: currentCourseId, completed: true, completed_at: new Date().toISOString() },
    { onConflict: 'user_id,formation_id' }
  );
  if (!error) {
    progressMap[currentCourseId] = { completed: true, completed_at: new Date().toISOString() };
    openCourse(currentCourseId);
    if (typeof showToast === 'function') showToast('✅ Cours complété', 'Progression enregistrée.', 'success');
  } else {
    btn.disabled = false;
    btn.innerHTML = '✓ Marquer comme lu';
  }
}

initCourses();
</script>
