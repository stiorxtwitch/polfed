<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formations — Police Fédérale Liège</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Exo+2:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg:#030a14; --panel:rgba(4,12,26,0.97);
            --blue:#1a56db; --blue-light:#3b82f6; --blue-dim:rgba(26,86,219,0.15); --blue-border:rgba(26,86,219,0.22);
            --gold:#c9a227; --gold-light:#e4b93a; --gold-dim:rgba(201,162,39,0.15); --gold-border:rgba(201,162,39,0.25);
            --text:#c5d8f0; --text-bright:#e8f4ff; --muted:#4a7a9b;
            --green:#22c55e; --green-dim:rgba(34,197,94,0.15); --green-border:rgba(34,197,94,0.25);
            --red:#ef4444; --red-dim:rgba(239,68,68,0.15); --red-border:rgba(239,68,68,0.25);
        }
        html,body { height:100%; background:var(--bg); font-family:'Exo 2',sans-serif; color:var(--text); overflow:hidden; }
        body::before { content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
            background-image:linear-gradient(rgba(26,86,219,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(26,86,219,0.03) 1px,transparent 1px);
            background-size:40px 40px; animation:gridDrift 50s linear infinite; }
        @keyframes gridDrift{0%{background-position:0 0}100%{background-position:40px 40px}}

        /* HEADER */
        .t-header { height:56px; background:rgba(3,10,20,0.99); border-bottom:1px solid var(--blue-border); display:flex; align-items:center; justify-content:space-between; padding:0 20px; position:relative; z-index:100; flex-shrink:0; }
        .t-header::after { content:''; position:absolute; bottom:0; left:0; right:0; height:1px; background:linear-gradient(90deg,transparent,var(--gold),var(--blue),transparent); opacity:0.4; }
        .hdr-left { display:flex; align-items:center; gap:14px; }
        .logo-link { display:flex; align-items:center; gap:9px; text-decoration:none; }
        .logo-link img { width:28px; height:33px; filter:drop-shadow(0 0 6px rgba(201,162,39,0.4)); }
        .logo-txt .m { font-family:'Rajdhani',sans-serif; font-size:15px; font-weight:700; letter-spacing:3px; color:#fff; display:block; line-height:1; }
        .logo-txt .s { font-size:9px; letter-spacing:2px; color:var(--gold); text-transform:uppercase; display:block; }
        .divider { width:1px; height:28px; background:var(--blue-border); }
        .sec-badge { font-family:'Rajdhani',sans-serif; font-size:11px; font-weight:700; letter-spacing:2px; color:var(--gold); background:var(--gold-dim); border:1px solid var(--gold-border); padding:3px 10px; border-radius:2px; }
        .hdr-nav { display:flex; align-items:center; gap:2px; }
        .hdr-nav a { font-family:'Rajdhani',sans-serif; font-size:10px; font-weight:600; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted); text-decoration:none; padding:5px 9px; border-radius:2px; transition:all 0.15s; }
        .hdr-nav a:hover,.hdr-nav a.active { color:var(--text-bright); background:var(--blue-dim); }
        .hdr-right { display:flex; align-items:center; gap:8px; }
        .btn { font-family:'Rajdhani',sans-serif; font-size:11px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; padding:6px 12px; border:none; border-radius:2px; cursor:pointer; transition:all 0.2s; text-decoration:none; display:inline-flex; align-items:center; gap:5px; }
        .btn-ghost { background:transparent; color:var(--muted); border:1px solid var(--blue-border); }
        .btn-ghost:hover { color:var(--text); border-color:var(--blue-light); }
        .btn-success { background:var(--green-dim); color:#86efac; border:1px solid var(--green-border); }
        .btn-success:hover { background:rgba(34,197,94,0.25); }
        .btn-gold { background:var(--gold); color:#000; font-weight:700; }
        .btn-gold:hover { background:var(--gold-light); }

        /* LAYOUT */
        .app-body { display:flex; height:calc(100vh - 56px); position:relative; z-index:1; }

        /* LEFT SIDEBAR */
        .course-list { width:280px; flex-shrink:0; background:var(--panel); border-right:1px solid var(--blue-border); display:flex; flex-direction:column; overflow:hidden; }
        .cl-header { padding:14px; border-bottom:1px solid var(--blue-border); }
        .cl-title { font-family:'Rajdhani',sans-serif; font-size:12px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:var(--blue-light); margin-bottom:10px; }
        .progress-bar-wrap { background:rgba(26,86,219,0.1); border-radius:10px; height:6px; overflow:hidden; }
        .progress-bar { height:100%; background:linear-gradient(90deg,var(--blue),var(--gold)); border-radius:10px; transition:width 0.5s; }
        .progress-text { font-size:10px; color:var(--muted); margin-top:5px; letter-spacing:1px; }
        .cl-scroll { flex:1; overflow-y:auto; padding:8px; }
        .cl-scroll::-webkit-scrollbar { width:3px; }
        .cl-scroll::-webkit-scrollbar-thumb { background:var(--blue-border); border-radius:2px; }

        .course-item { padding:10px 12px; margin-bottom:5px; background:rgba(26,86,219,0.05); border:1px solid var(--blue-border); border-radius:4px; cursor:pointer; transition:all 0.15s; position:relative; }
        .course-item:hover { background:var(--blue-dim); border-color:var(--blue-light); }
        .course-item.active { background:var(--blue-dim); border-color:var(--blue-light); border-left:3px solid var(--blue-light); }
        .course-item.completed { border-color:var(--green-border); }
        .course-item.completed.active { border-left-color:var(--green); }
        .ci-top { display:flex; align-items:center; gap:8px; margin-bottom:4px; }
        .ci-icon { font-size:16px; }
        .ci-name { font-family:'Rajdhani',sans-serif; font-size:13px; font-weight:700; letter-spacing:1px; color:var(--text-bright); flex:1; }
        .ci-check { color:var(--green); font-size:13px; }
        .ci-desc { font-size:10px; color:var(--muted); line-height:1.5; }
        .ci-tags { display:flex; gap:4px; flex-wrap:wrap; margin-top:5px; }
        .ci-tag { font-size:8px; letter-spacing:1px; padding:1px 5px; border-radius:2px; background:var(--blue-dim); border:1px solid var(--blue-border); color:var(--muted); text-transform:uppercase; }

        /* RIGHT CONTENT */
        .course-content { flex:1; display:flex; flex-direction:column; overflow:hidden; }
        .cc-header { padding:14px 20px; border-bottom:1px solid var(--blue-border); display:flex; align-items:center; justify-content:space-between; background:rgba(4,12,26,0.5); flex-shrink:0; }
        .cc-title { font-family:'Rajdhani',sans-serif; font-size:18px; font-weight:700; letter-spacing:2px; color:var(--text-bright); }
        .cc-meta { font-size:10px; color:var(--muted); letter-spacing:1px; margin-top:2px; }
        .cc-scroll { flex:1; overflow-y:auto; padding:24px; }
        .cc-scroll::-webkit-scrollbar { width:4px; }
        .cc-scroll::-webkit-scrollbar-thumb { background:var(--blue-border); border-radius:2px; }
        .cc-footer { padding:14px 20px; border-top:1px solid var(--blue-border); display:flex; align-items:center; justify-content:space-between; background:rgba(4,12,26,0.5); flex-shrink:0; }

        /* COURSE CONTENT STYLES */
        .course-html-content { line-height:1.8; font-size:13px; color:var(--text); max-width:760px; }
        .course-html-content h1 { font-family:'Rajdhani',sans-serif; font-size:24px; font-weight:700; letter-spacing:2px; color:var(--gold-light); margin-bottom:16px; padding-bottom:10px; border-bottom:1px solid var(--gold-border); }
        .course-html-content h2 { font-family:'Rajdhani',sans-serif; font-size:18px; font-weight:700; letter-spacing:1.5px; color:var(--blue-light); margin:24px 0 12px; }
        .course-html-content h3 { font-family:'Rajdhani',sans-serif; font-size:15px; font-weight:700; letter-spacing:1px; color:var(--text-bright); margin:18px 0 8px; }
        .course-html-content p { margin-bottom:12px; }
        .course-html-content ul, .course-html-content ol { margin:10px 0 10px 20px; }
        .course-html-content li { margin-bottom:5px; }
        .course-html-content strong { color:var(--text-bright); font-weight:600; }
        .course-html-content em { color:var(--gold); font-style:italic; }
        .course-html-content blockquote { border-left:3px solid var(--gold-border); padding:10px 16px; background:var(--gold-dim); border-radius:0 4px 4px 0; margin:14px 0; font-style:italic; color:var(--muted); }
        .course-html-content table { width:100%; border-collapse:collapse; margin:14px 0; }
        .course-html-content th { padding:8px 12px; background:rgba(26,86,219,0.1); border:1px solid var(--blue-border); font-family:'Rajdhani',sans-serif; font-size:11px; letter-spacing:1px; text-transform:uppercase; color:var(--blue-light); }
        .course-html-content td { padding:8px 12px; border:1px solid rgba(26,86,219,0.15); }
        .course-html-content .info-box { background:var(--blue-dim); border:1px solid var(--blue-border); border-radius:4px; padding:12px 14px; margin:12px 0; }
        .course-html-content .warning-box { background:rgba(245,158,11,0.1); border:1px solid rgba(245,158,11,0.25); border-radius:4px; padding:12px 14px; margin:12px 0; color:#fcd34d; }
        .course-html-content .success-box { background:var(--green-dim); border:1px solid var(--green-border); border-radius:4px; padding:12px 14px; margin:12px 0; color:#86efac; }

        /* WELCOME SCREEN */
        .welcome-screen { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; text-align:center; gap:16px; opacity:0.6; }
        .welcome-icon { font-size:5rem; }
        .welcome-title { font-family:'Rajdhani',sans-serif; font-size:20px; font-weight:700; letter-spacing:3px; color:var(--muted); }
        .welcome-sub { font-size:11px; color:var(--muted); letter-spacing:1px; }

        /* COMPLETED BANNER */
        .completed-banner { background:var(--green-dim); border:1px solid var(--green-border); border-radius:4px; padding:10px 14px; margin-bottom:16px; display:flex; align-items:center; gap:8px; font-size:12px; color:#86efac; font-family:'Rajdhani',sans-serif; letter-spacing:1px; }

        ::-webkit-scrollbar { width:4px; } ::-webkit-scrollbar-thumb { background:var(--blue-border); border-radius:2px; }
    </style>
</head>
<body>

<header class="t-header">
    <div class="hdr-left">
        <a href="index.html" class="logo-link">
            <img src="https://i.imgur.com/Pe4YRPe.png" alt="PFL">
            <div class="logo-txt"><span class="m">Police Fédérale</span><span class="s">Liège City RP</span></div>
        </a>
        <div class="divider"></div>
        <div class="sec-badge">📚 Formations</div>
        <nav class="hdr-nav" id="mainNav"></nav>
    </div>
    <div class="hdr-right">
        <a href="police-rdv.html" class="btn btn-gold">📅 Prendre RDV</a>
        <a href="police-portal.html" class="btn btn-ghost">← Portail</a>
    </div>
</header>

<div class="app-body">
    <!-- SIDEBAR -->
    <div class="course-list">
        <div class="cl-header">
            <div class="cl-title">📋 Cours Disponibles</div>
            <div class="progress-bar-wrap">
                <div class="progress-bar" id="progressBar" style="width:0%"></div>
            </div>
            <div class="progress-text" id="progressText">0 / 0 cours complétés</div>
        </div>
        <div class="cl-scroll" id="courseListEl">
            <div style="text-align:center;padding:20px;color:var(--muted);font-size:11px">Chargement...</div>
        </div>
    </div>

    <!-- CONTENT -->
    <div class="course-content">
        <div id="courseHeader" class="cc-header" style="display:none">
            <div>
                <div class="cc-title" id="courseTitleEl">—</div>
                <div class="cc-meta" id="courseMetaEl">—</div>
            </div>
            <div id="completedBadge"></div>
        </div>

        <div class="cc-scroll" id="courseScroll">
            <div class="welcome-screen" id="welcomeScreen">
                <div class="welcome-icon">📚</div>
                <div class="welcome-title">Sélectionnez un cours</div>
                <div class="welcome-sub">Choisissez un module de formation dans la liste</div>
            </div>
            <div id="courseBody" style="display:none">
                <div id="completedBannerEl" style="display:none" class="completed-banner">
                    ✓ Vous avez déjà complété ce cours
                </div>
                <div class="course-html-content" id="courseContentHtml"></div>
            </div>
        </div>

        <div id="courseFooter" class="cc-footer" style="display:none">
            <div style="font-size:11px;color:var(--muted)" id="footerInfo">—</div>
            <button class="btn btn-success" id="markReadBtn" onclick="markCompleted()">✓ Marquer comme lu</button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="js/main.js"></script>
<script>
const currentUser = requireRole('agent');
if (!currentUser) throw new Error();

const isOfficier = (ROLES_LEVEL[currentUser.role]||0) >= 3;
const isSuperv   = (ROLES_LEVEL[currentUser.role]||0) >= 2;

const navLinks = [
    { href:'police-complaints.html', label:'📋 Plaintes' },
    { href:'police-courses.html', label:'📚 Formations', active:true },
    { href:'police-rdv.html', label:'📅 Rendez-vous' },
    ...(isSuperv ? [{ href:'police-kahoot-host.html', label:'🎮 Kahoot' }] : [{ href:'police-kahoot-join.html', label:'🎮 Examen' }]),
    ...(isSuperv ? [{ href:'police-rdv-admin.html', label:'👔 RDV Admin' }] : []),
    ...(isOfficier ? [{ href:'police-personnel.html', label:'👥 Personnel' }] : []),
    { href:'police-profile.html', label:'👤 Profil' },
];
document.getElementById('mainNav').innerHTML = navLinks.map(l =>
    `<a href="${l.href}" ${l.active ? 'class="active"' : ''}>${l.label}</a>`
).join('');

let courses = [];
let progressMap = {};
let currentCourseId = null;

// Default course content (placeholders for the 4 courses until content is provided)
const DEFAULT_COURSES = [
    {
        ordre: 1, icon: '⚖️', badge_icon: '⚖️', badge_titre: 'Droit Pénal Certifié',
        titre: 'Droit Pénal & Procédure',
        description: 'Code pénal, procédure pénale, droits fondamentaux',
        tags: ['Droit', 'Procédure', 'Obligatoire'],
        content: `<h1>⚖️ Droit Pénal & Procédure</h1>
<div class="warning-box">⚠️ Ce cours est en cours de rédaction. Le contenu sera fourni par la hiérarchie.</div>
<h2>Introduction</h2>
<p>Ce module couvre les fondamentaux du droit pénal appliqués à la fonction de police dans le cadre du City RP de Liège.</p>
<h2>Au programme</h2>
<ul><li>Code pénal applicable</li><li>Procédure pénale et droits de la défense</li><li>Pouvoirs de police et limites légales</li><li>Gardes à vue et interpellations</li></ul>
<blockquote>Contenu en attente de validation par les officiers. Revenez prochainement.</blockquote>`
    },
    {
        ordre: 2, icon: '🚔', badge_icon: '🚔', badge_titre: 'Intervention Certifiée',
        titre: 'Techniques d\'Intervention',
        description: 'Procédures d\'intervention, sécurisation, neutralisation',
        tags: ['Terrain', 'Tactique', 'Obligatoire'],
        content: `<h1>🚔 Techniques d'Intervention</h1>
<div class="warning-box">⚠️ Ce cours est en cours de rédaction. Le contenu sera fourni par la hiérarchie.</div>
<h2>Introduction</h2>
<p>Ce module présente les procédures standardisées d'intervention de la Police Fédérale de Liège.</p>
<h2>Au programme</h2>
<ul><li>Approche et sécurisation d'une scène</li><li>Communication radio et codes</li><li>Interpellation et contrôle d'identité</li><li>Gestion des situations critiques</li></ul>
<blockquote>Contenu en attente de validation par les officiers. Revenez prochainement.</blockquote>`
    },
    {
        ordre: 3, icon: '🚦', badge_icon: '🚦', badge_titre: 'Code Route Certifié',
        titre: 'Code de la Route & Conduite',
        description: 'Réglementation routière, interceptions, accidents',
        tags: ['Code Route', 'Conduite', 'Obligatoire'],
        content: `<h1>🚦 Code de la Route & Conduite</h1>
<div class="warning-box">⚠️ Ce cours est en cours de rédaction. Le contenu sera fourni par la hiérarchie.</div>
<h2>Introduction</h2>
<p>Ce module couvre les aspects réglementaires du code de la route et les procédures d'interception.</p>
<h2>Au programme</h2>
<ul><li>Code de la route applicable dans le City RP</li><li>Procédures d'interception de véhicules</li><li>Gestion des accidents et constatations</li><li>Infractions et barèmes de sanctions</li></ul>
<blockquote>Contenu en attente de validation par les officiers. Revenez prochainement.</blockquote>`
    },
    {
        ordre: 4, icon: '📋', badge_icon: '📋', badge_titre: 'Procédures Admin',
        titre: 'Procédures Administratives',
        description: 'Rédaction de rapports, plaintes, procès-verbaux',
        tags: ['Admin', 'Rédaction', 'Obligatoire'],
        content: `<h1>📋 Procédures Administratives</h1>
<div class="warning-box">⚠️ Ce cours est en cours de rédaction. Le contenu sera fourni par la hiérarchie.</div>
<h2>Introduction</h2>
<p>Ce module explique comment rédiger et traiter les documents administratifs de la police.</p>
<h2>Au programme</h2>
<ul><li>Rédaction de procès-verbaux</li><li>Traitement des plaintes civiles</li><li>Rapports d'intervention</li><li>Archivage et confidentialité</li></ul>
<blockquote>Contenu en attente de validation par les officiers. Revenez prochainement.</blockquote>`
    }
];

async function initCourses() {
    // Fetch or create default courses
    let { data: dbCourses } = await supabase.from('table_policefed_formations').select('*').order('ordre');
    
    if (!dbCourses || dbCourses.length === 0) {
        // Insert default courses if none exist
        const { data: inserted } = await supabase.from('table_policefed_formations').insert(
            DEFAULT_COURSES.map(c => ({ titre: c.titre, description: c.description, content: c.content, ordre: c.ordre, icon: c.icon, badge_icon: c.badge_icon, badge_titre: c.badge_titre }))
        ).select();
        dbCourses = inserted || [];
    }
    
    courses = dbCourses;

    // Load progress
    const { data: prog } = await supabase.from('table_policefed_progress').select('*').eq('user_id', currentUser.id);
    progressMap = {};
    (prog||[]).forEach(p => progressMap[p.formation_id] = p);

    renderCourseList();
}

function renderCourseList() {
    const completed = courses.filter(c => progressMap[c.id]?.completed).length;
    const pct = courses.length > 0 ? Math.round(completed / courses.length * 100) : 0;
    document.getElementById('progressBar').style.width = pct + '%';
    document.getElementById('progressText').textContent = `${completed} / ${courses.length} cours complétés`;

    document.getElementById('courseListEl').innerHTML = courses.map(c => {
        const done = progressMap[c.id]?.completed;
        const dc = DEFAULT_COURSES.find(d => d.ordre === c.ordre);
        const tags = dc?.tags || [];
        return `
            <div class="course-item ${done ? 'completed' : ''} ${currentCourseId === c.id ? 'active' : ''}" onclick="openCourse('${c.id}')">
                <div class="ci-top">
                    <div class="ci-icon">${c.icon||'📚'}</div>
                    <div class="ci-name">${escapeHtml(c.titre)}</div>
                    ${done ? '<div class="ci-check">✓</div>' : ''}
                </div>
                <div class="ci-desc">${escapeHtml(c.description||'')}</div>
                <div class="ci-tags">${tags.map(t => `<span class="ci-tag">${t}</span>`).join('')}</div>
            </div>
        `;
    }).join('');
}

function openCourse(id) {
    const course = courses.find(c => c.id === id);
    if (!course) return;
    currentCourseId = id;
    const done = progressMap[id]?.completed;

    document.getElementById('welcomeScreen').style.display = 'none';
    document.getElementById('courseBody').style.display = 'block';
    document.getElementById('courseHeader').style.display = 'flex';
    document.getElementById('courseFooter').style.display = 'flex';

    document.getElementById('courseTitleEl').textContent = course.titre;
    document.getElementById('courseMetaEl').textContent = `${course.icon||'📚'} Module de Formation — Police Fédérale Liège`;
    document.getElementById('courseContentHtml').innerHTML = course.content || '<p style="color:var(--muted)">Contenu non disponible.</p>';
    document.getElementById('completedBannerEl').style.display = done ? 'flex' : 'none';
    document.getElementById('footerInfo').textContent = done
        ? `✓ Complété le ${formatDateFull(progressMap[id]?.completed_at)}`
        : 'Lisez entièrement le cours avant de le marquer comme lu.';

    const btn = document.getElementById('markReadBtn');
    if (done) {
        btn.textContent = '✓ Cours complété';
        btn.disabled = true;
        btn.style.opacity = '0.5';
    } else {
        btn.innerHTML = '✓ Marquer comme lu';
        btn.disabled = false;
        btn.style.opacity = '1';
    }

    document.getElementById('courseScroll').scrollTop = 0;
    renderCourseList();
}

async function markCompleted() {
    if (!currentCourseId) return;
    const btn = document.getElementById('markReadBtn');
    btn.disabled = true;
    btn.textContent = 'Enregistrement...';

    const { error } = await supabase.from('table_policefed_progress').upsert({
        user_id: currentUser.id,
        formation_id: currentCourseId,
        completed: true,
        completed_at: new Date().toISOString()
    }, { onConflict: 'user_id,formation_id' });

    if (!error) {
        progressMap[currentCourseId] = { completed: true, completed_at: new Date().toISOString() };
        openCourse(currentCourseId);
        showToast('✅ Cours complété', 'Votre progression a été enregistrée.', 'success');
    } else {
        btn.disabled = false;
        btn.innerHTML = '✓ Marquer comme lu';
    }
}

initCourses();
</script>
</body>
</html>
